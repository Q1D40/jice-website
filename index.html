<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101113" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="机策" />
    <title>机策</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <picture class="stage__visual" aria-hidden="true">
        <source
          media="(max-width: 760px) and (orientation: portrait)"
          srcset="./assets/jice-space-portrait.png"
        />
        <img
          src="./assets/jice-space-wide.png"
          width="1672"
          height="941"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <h1 class="brand">
        <img
          src="./assets/jice-lockup.svg"
          alt="机策"
          width="1200"
          height="520"
          draggable="false"
        />
      </h1>
    </main>
  </body>
</html>
